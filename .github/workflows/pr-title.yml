name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check "type(scope): message"
        env:
          TITLE: ${{ github.event.pull_request.title }}  # via env, never inline in the script
        run: |
          echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9._-]+\)!?: .+' \
            || { echo "PR title must look like: feat(plugin): message"; exit 1; }
