name: Feature request
description: Suggest something a widget should do
labels: [enhancement]
body:
  - type: dropdown
    id: widget
    attributes:
      label: Which widget?
      options:
        - mullvad
        - A new widget
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
